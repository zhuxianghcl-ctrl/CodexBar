name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $Expected = $env:GITHUB_REF_NAME.TrimStart("v")
          $Project = Get-Content -Raw -LiteralPath .\pyproject.toml
          if ($Project -notmatch '(?m)^version = "([^"]+)"$') {
            throw "Project version was not found."
          }
          if ($Matches[1] -ne $Expected) {
            throw "Tag version does not match pyproject.toml."
          }

      - name: Verify and build release
        shell: pwsh
        run: |
          uv lock --check
          uv sync --frozen --group build
          uv run --frozen python -m unittest -q .\test_codexbar.py
          uv run --frozen python -m compileall -q .\codexbar .\codexbar.pyw .\codexbar_dashboard.pyw .\test_codexbar.py
          .\scripts\build_exe.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            .\dist\CodexBar-Windows-x64.zip `
            .\dist\CodexBar-Windows-x64.zip.sha256 `
            --verify-tag `
            --generate-notes `
            --title "CodexBar $env:GITHUB_REF_NAME"
